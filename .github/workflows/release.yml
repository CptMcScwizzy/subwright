name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag and the code must agree on the version
        # __version__ lives in Python and the image label comes from a build
        # arg. Nothing otherwise stops a v0.2.0 tag producing an image labelled
        # 0.2.0 whose --version still reports 0.1.0, which is the kind of thing
        # nobody notices until they are trying to work out what is deployed.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          code="$(grep '^__version__' src/subwright/__main__.py | cut -d'"' -f2)"
          echo "tag=$tag  code=$code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag does not match __version__ $code in src/subwright/__main__.py"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install pytest fastapi "uvicorn[standard]" jinja2 python-multipart httpx

      - name: Tests must pass before anything is published
        run: pytest -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/}"
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "tags=ghcr.io/${repo}:${version},ghcr.io/${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and load for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: subwright:verify
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Self-test the exact image about to be published
        run: docker run --rm subwright:verify --self-test

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
