name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install pytest fastapi "uvicorn[standard]" jinja2 python-multipart httpx

      - name: Tests must pass before anything is published
        run: pytest -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/}"
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "tags=ghcr.io/${repo}:${version},ghcr.io/${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and load for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: subwright:verify
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Self-test the exact image about to be published
        run: docker run --rm subwright:verify --self-test

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
