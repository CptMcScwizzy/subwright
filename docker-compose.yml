services:
  subwright:
    # Override with SUBWRIGHT_IMAGE to run a locally built image, e.g. during
    # validation before anything has been published to the registry.
    image: ${SUBWRIGHT_IMAGE:-ghcr.io/cptmcscwizzy/subwright:${SUBWRIGHT_TAG:-v0.1.0}}
    container_name: subwright
    restart: unless-stopped

    # Matches the NFS export mapping and the other containers on the target
    # host, so generated subtitles are readable by Plex and Stash.
    user: "1000:1000"

    ports:
      # Host port is configurable so an override can MOVE it. Compose
      # concatenates port lists when merging files, so an override that
      # simply lists another port would publish both.
      - "${SW_PUBLISH_PORT:-8420}:8420"

    environment:
      - TZ=${TZ:-UTC}
      - SW_WATCH_DIR=${WATCH_DIR:-/mnt/data/translate}
      - SW_LANGUAGE=${SW_LANGUAGE:-}
      - SW_MODEL=${SW_MODEL:-large-v3}
      - SW_DEVICE=${SW_DEVICE:-cuda}
      - SW_COMPUTE_TYPE=${SW_COMPUTE_TYPE:-int8}
      # These three seed the first run only; after that the Settings page is
      # the source of truth. Listed here because Compose forwards only what is
      # named - a variable in .env alone never reaches the container, which is
      # a confusing way to discover that a documented setting does nothing.
      - SW_REUSE_SUBTITLES=${SW_REUSE_SUBTITLES:-}
      - SW_WRITE_REPORTS=${SW_WRITE_REPORTS:-}
      - SW_SHOW_PREVIEW=${SW_SHOW_PREVIEW:-}

    volumes:
      # Same path inside and out, so a path in the UI or the log can be pasted
      # straight into a shell on the host.
      - ${WATCH_DIR:-/mnt/data/translate}:${WATCH_DIR:-/mnt/data/translate}
      #
      # Watching MORE THAN ONE folder? Every folder configured on the Folders
      # page must be mounted here too, or it simply does not exist inside the
      # container. Either add a line per folder, or mount a common parent:
      #   - /mnt/data:/mnt/data
      # The Folders page refuses to save a folder it cannot reach, and says so.

      # Whisper weights (~3 GB). Named volume so a container recreate does not
      # re-download them.
      - subwright-models:/models
      # SQLite. MUST be a local volume - never the NFS mount.
      - subwright-config:/config

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Long enough for the current transcription to be abandoned cleanly and its
    # scratch file removed, so the job is resumable rather than half-written.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named explicitly. Compose otherwise prefixes volumes with the project
  # name, which silently creates a new empty volume instead of using one
  # that was seeded ahead of time.
  subwright-models:
    name: subwright-models
  subwright-config:
    name: subwright-config
